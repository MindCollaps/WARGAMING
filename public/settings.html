<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bildupload</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      #imagePreview {
        max-width: 300px;
        margin-top: 20px;
      }
      .preview-container {
        display: none;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center" id="app">
        <div class="col-md-8">
          <div
            v-if="user && user.length > 0"
            class="alert alert-success mt-4"
            role="alert"
          >
            <p>{{ user }}</p>
          </div>
          <div
            v-else
            class="alert alert-danger mt-4"
            role="alert"
          >
            <p>Trick pepe to reveal his secret</p>
          </div>

          <div class="card">
            <div
              class="card-header d-flex justify-content-between align-items-center"
            >
              <h2 class="text-center">Bildupload</h2>
              <a href="/community.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Zurück
              </a>
            </div>
            <div class="card-body">
              <form @submit.prevent="uploadImage">
                <div class="mb-3">
                  <label for="imageInput" class="form-label"
                    >Wähle ein Bild aus</label
                  >
                  <input
                    type="file"
                    class="form-control"
                    id="imageInput"
                    accept="image/*"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary">Hochladen</button>
              </form>

              <div
                v-if="previewPath"
                class="mt-4 d-flex flex-column justify-content-center align-items-center"
              >
                <div class="alert alert-success mb-3">
                  Bild erfolgreich hochgeladen!
                </div>
                <h3>Bildvorschau:</h3>
                <img
                  :src="previewPath"
                  class="img-fluid"
                  alt="Bildvorschau"
                  style="max-width: 300px"
                />
                <p>
                  <a :href="'/community.html'" target="_blank"
                    >Sieh dir den neuen Hintergrund im Forum an</a
                  >
                </p>
              </div>

              <div v-if="errorMsg" class="alert alert-danger mt-4" role="alert">
                {{ errorMsg }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
      const { createApp, ref, onMounted } = Vue;

      createApp({
        setup() {
          const errorMsg = ref("");
          const previewPath = ref("");
          const user = ref("");

          async function check() {
            console.log("check");
            try {
              const response = await fetch("/api/admin/check", {
                headers: {
                  authorization: localStorage.getItem("jwt"),
                },
              });
              const result = await response.json();

              if (response.ok && result.data) {
                user.value = result.data;
              }
            } catch (error) {
              console.error(error);
            }
          }

          async function uploadImage() {
            const formData = new FormData();
            const fileInput = document.getElementById("imageInput");

            formData.append("image", fileInput.files[0]);
            errorMsg.value = "";
            previewPath.value = "";

            try {
              const response = await fetch("/api/admin/upload/background", {
                method: "POST",
                body: formData,
                headers: {
                  authorization: localStorage.getItem("jwt"),
                },
              });

              const result = await response.json();

              if (response.ok) {
                previewPath.value = result.path;
              } else {
                throw new Error(result.message || result.response);
              }
            } catch (error) {
              previewPath.value = "";
              errorMsg.value = error.message;
            }
          }

          onMounted(() => {
            check();
          });

          return {
            errorMsg,
            previewPath,
            uploadImage,
            user,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
